name: Task reminders

# Calls the reminder sweep every 15 minutes. GitHub may run scheduled jobs a
# few minutes late; the sweep sends anything starting within the next 20
# minutes (or up to 10 minutes ago), so a late run still delivers on time-ish.
# Needs repository secrets APP_URL (e.g. https://your-app.vercel.app) and
# CRON_SECRET (the same value as the app's CRON_SECRET env var).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run reminder sweep
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
