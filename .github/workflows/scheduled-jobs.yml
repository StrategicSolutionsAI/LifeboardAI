name: Scheduled jobs

# Every 15 minutes: send task reminders and refresh subscribed calendars that
# are over 6 hours old. GitHub may start scheduled runs a few minutes late; the
# reminder sweep covers tasks starting within the next 20 minutes (or up to 10
# minutes ago), so a late run still delivers.
# Needs repository secrets APP_URL (e.g. https://your-app.vercel.app) and
# CRON_SECRET (the same value as the app's CRON_SECRET env var).
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret not set; skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Task reminders
        if: steps.config.outputs.ready == 'true'
        run: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/reminders"
      - name: Calendar feeds
        if: steps.config.outputs.ready == 'true' && always()
        run: curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/calendar-feeds"
